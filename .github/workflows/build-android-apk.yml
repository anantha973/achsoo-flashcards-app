name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build & Release Achsoo Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute auto-incrementing build version
        id: version
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.2.${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}"
          COMMIT_MSG=$(git log -1 --pretty=%s | tr '\r\n' ' ')
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle with GitHub Release metadata
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VITE_APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure consistent release signing if secret is set
        id: signing
        env:
          ACHSOO_KEYSTORE_B64: ${{ secrets.ACHSOO_KEYSTORE_B64 }}
        run: |
          if [ -n "$ACHSOO_KEYSTORE_B64" ]; then
            echo "$ACHSOO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/achsoo-release.keystore"
            echo "signed_release=true" >> "$GITHUB_OUTPUT"
            echo "keystore_file=$RUNNER_TEMP/achsoo-release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed_release=false" >> "$GITHUB_OUTPUT"
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Android APK
        working-directory: android
        env:
          ACHSOO_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ACHSOO_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ACHSOO_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          ACHSOO_KEYSTORE_PASS: ${{ secrets.ACHSOO_KEYSTORE_PASS }}
          ACHSOO_KEY_ALIAS: ${{ secrets.ACHSOO_KEY_ALIAS }}
          ACHSOO_KEY_PASS: ${{ secrets.ACHSOO_KEY_PASS }}
        run: |
          if [ "${{ steps.signing.outputs.signed_release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Prepare APK & SHA-256 release manifest
        id: release_assets
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.signed_release }}
          COMMIT_MSG: ${{ steps.version.outputs.commit_msg }}
        run: |
          mkdir -p artifacts
          if [ "${{ steps.signing.outputs.signed_release }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/Achsoo.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Achsoo.apk
          fi

          export APK_SHA256=$(sha256sum artifacts/Achsoo.apk | awk '{print $1}')
          export APK_SIZE=$(stat -c%s artifacts/Achsoo.apk)
          export PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          node -e '
            const fs = require("fs");
            const manifest = {
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              tagName: process.env.TAG_NAME,
              publishedAt: process.env.PUBLISHED_AT,
              apkFileName: "Achsoo.apk",
              apkSizeBytes: Number(process.env.APK_SIZE),
              sha256: process.env.APK_SHA256,
              signedRelease: process.env.SIGNED_RELEASE === "true",
              releaseNotes: process.env.COMMIT_MSG || "Latest Achsoo update"
            };
            fs.writeFileSync("artifacts/achsoo-release.json", JSON.stringify(manifest, null, 2));
          '

      - name: Publish GitHub Release for one-tap in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          COMMIT_MSG: ${{ steps.version.outputs.commit_msg }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.signed_release }}
        run: |
          if [ "$SIGNED_RELEASE" = "true" ]; then
            SIGNED_NOTE="Signed with your persistent release keystore (in-place update preserves all study data)."
          else
            SIGNED_NOTE="Debug-signed build. Add ACHSOO_KEYSTORE_B64, ACHSOO_KEYSTORE_PASS, and ACHSOO_KEY_ALIAS to GitHub Actions Secrets once for seamless in-place updates."
          fi

          printf '%s\n\n%s\n' "${COMMIT_MSG:-Latest Achsoo update}" "$SIGNED_NOTE" > "$RUNNER_TEMP/release-notes.txt"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              artifacts/Achsoo.apk \
              artifacts/achsoo-release.json \
              --clobber
            gh release edit "$TAG_NAME" \
              --title "Achsoo $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" \
              --latest
          else
            gh release create "$TAG_NAME" \
              artifacts/Achsoo.apk \
              artifacts/achsoo-release.json \
              --title "Achsoo $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" \
              --latest
          fi

      - name: Upload Achsoo Android APK backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Achsoo-Android-APK
          path: artifacts/Achsoo.apk
          retention-days: 30
          if-no-files-found: error
