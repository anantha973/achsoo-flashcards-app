<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Achsoo — German Vocabulary &amp; Grammar SRS</title>
    <meta name="description" content="Responsive German Vocabulary &amp; Grammar Flashcards web application with Spaced Repetition (SRS), native de-DE audio pronunciation, and grammatical breakdowns across A1–B1 levels." />
    <meta property="og:title" content="Achsoo — German Vocabulary &amp; Grammar SRS" />
    <meta property="og:description" content="Responsive German Vocabulary &amp; Grammar Flashcards web application with Spaced Repetition (SRS), native de-DE audio pronunciation, and grammatical breakdowns across A1–B1 levels." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" data-boot-theme-color="true" />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" data-boot-theme-color="true" />
    <meta name="theme-color" content="#171412" id="meta-theme-color" />
    <meta name="color-scheme" content="dark light" id="meta-color-scheme" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="meta-apple-status-bar" />
    <meta name="apple-mobile-web-app-title" content="Achsoo" />
    <link id="app-favicon" rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-midday.png" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-midday.png" />
    <link id="app-manifest" rel="manifest" href="/manifest-midday.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var hour = new Date().getHours();
          var iconSlot =
            hour >= 5 && hour < 9
              ? 'morning'
              : hour >= 9 && hour < 13
              ? 'midday'
              : hour >= 13 && hour < 17
              ? 'afternoon'
              : hour >= 17 && hour < 21
              ? 'evening'
              : hour >= 21
              ? 'late-night'
              : 'sleep';
          document.documentElement.setAttribute('data-app-icon-slot', iconSlot);
          var favEl = document.getElementById('app-favicon');
          if (favEl) favEl.setAttribute('href', '/icons/favicon-' + iconSlot + '.png');
          var appleEl = document.getElementById('app-apple-touch-icon');
          if (appleEl) appleEl.setAttribute('href', '/icons/apple-touch-icon-' + iconSlot + '.png');
          var manifestEl = document.getElementById('app-manifest');
          if (manifestEl) manifestEl.setAttribute('href', '/manifest-' + iconSlot + '.webmanifest');

          var themeId = 'nordic';
          var colorMode = '';
          var rawV2 = localStorage.getItem('wortschatz_theme_v2');
          if (rawV2) {
            var parsed = JSON.parse(rawV2);
            if (parsed && (parsed.themeId === 'nordic' || parsed.themeId === 'hero' || parsed.themeId === 'coss')) {
              themeId = parsed.themeId;
            }
            if (parsed && (parsed.colorMode === 'light' || parsed.colorMode === 'dark')) {
              colorMode = parsed.colorMode;
            }
          } else {
            var legacy = localStorage.getItem('wortschatz_theme_v1');
            if (legacy === 'dark') {
              themeId = 'nordic';
              colorMode = 'dark';
            } else if (legacy === 'light') {
              themeId = 'hero';
              colorMode = 'light';
            } else if (legacy === 'nordic') {
              themeId = 'nordic';
              colorMode = 'light';
            }
          }
          if (!colorMode) {
            colorMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', themeId);
          root.classList.remove('theme-nordic', 'theme-hero', 'theme-coss', 'dark');
          root.classList.add('theme-' + themeId);
          if (colorMode === 'dark') {
            root.classList.add('dark');
          }
          root.style.colorScheme = colorMode;
          var metaColorMap = {
            'nordic:light': '#FAF8F5',
            'nordic:dark': '#171412',
            'hero:light': '#F8FAFC',
            'hero:dark': '#09090B',
            'coss:light': '#FAFAFA',
            'coss:dark': '#09090B'
          };
          var resolvedBg = metaColorMap[themeId + ':' + colorMode] || (colorMode === 'dark' ? '#171412' : '#FAF8F5');
          root.style.backgroundColor = resolvedBg;
          // Remove media-scoped fallbacks once exact user theme is resolved so mobile Chrome locks onto resolvedBg
          var bootMetas = document.querySelectorAll('meta[data-boot-theme-color="true"]');
          for (var i = 0; i < bootMetas.length; i++) {
            bootMetas[i].parentNode && bootMetas[i].parentNode.removeChild(bootMetas[i]);
          }
          var metaEl = document.getElementById('meta-theme-color');
          if (metaEl) {
            metaEl.setAttribute('content', resolvedBg);
          }
          var colorSchemeEl = document.getElementById('meta-color-scheme');
          if (colorSchemeEl) {
            colorSchemeEl.setAttribute('content', colorMode);
          }
          var appleStatusBarEl = document.getElementById('meta-apple-status-bar');
          if (appleStatusBarEl) {
            appleStatusBarEl.setAttribute('content', colorMode === 'dark' ? 'black-translucent' : 'default');
          }
          document.addEventListener('DOMContentLoaded', function () {
            if (document.body) {
              document.body.style.backgroundColor = resolvedBg;
              document.body.style.colorScheme = colorMode;
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--fg-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
